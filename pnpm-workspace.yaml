packages: ["apps/*", "packages/*", "scripts"]
allowBuilds:
  "@medusajs/telemetry": true
  esbuild: true
  "@swc/core": true
  sharp: true
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: false
  # next-intl's file watcher (message extraction, which T46 does not use). Its install script only
  # compiles from source when `npm_config_build_from_source=true`; the prebuilt binary comes with
  # the platform package (`@parcel/watcher-linux-x64-glibc`), so there is nothing to run (T46).
  "@parcel/watcher": false

# Payload's packages import `react` (and its types) without declaring them: @payloadcms/next
# declares neither, and @payloadcms/ui and @payloadcms/richtext-lexical declare `react` but not
# `@types/react`. pnpm then resolves them from its shared hoist folder (node_modules/.pnpm/node_modules),
# which holds the Medusa admin's React 18.3.1 and @types/react 18.3.31, so `RootLayout`'s children
# were typed with React 18 (TS2322 in (payload)/layout.tsx) and @payloadcms/next would load React 18
# outside Next's own alias. Declared as peers, they come from the app that uses them (T09).
packageExtensions:
  "@payloadcms/next":
    peerDependencies:
      react: "^19.0.1 || ^19.1.2 || ^19.2.1"
      react-dom: "^19.0.1 || ^19.1.2 || ^19.2.1"
      "@types/react": "^19.0.0"
      "@types/react-dom": "^19.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  "@payloadcms/ui":
    peerDependencies:
      "@types/react": "^19.0.0"
      "@types/react-dom": "^19.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  "@payloadcms/richtext-lexical":
    peerDependencies:
      "@types/react": "^19.0.0"
      "@types/react-dom": "^19.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true

# monaco-editor 0.57.0, the latest, pins dompurify 3.4.15 exactly, which has a critical advisory
# (GHSA-cg2g-xh64-v4q7, fixed in 3.4.17); it comes in through Payload's admin (@payloadcms/ui >
# @monaco-editor/react), and Payload 3.92.0 has the same chain. Nothing runs this copy: monaco's
# code imports its own bundled DOMPurify, and Payload's code fields load monaco 0.55.1 from
# jsdelivr at runtime. The override only clears the audit (SETUP.md, "dompurify 3.4.17"). Drop it
# once monaco-editor depends on dompurify >=3.4.17. A caret, not an exact pin, so that a later
# monaco that wants a newer 3.x is not held back to 3.4.17.
overrides:
  "monaco-editor>dompurify": "^3.4.17"
  # T55 (SETUP.md, "Hardening (T55)"): each a fixed release inside the dependant's own range, on that
  # edge only. Drop one once the dependant's declared range itself starts at the fixed release or
  # later (its package.json, not the lockfile, which the override keeps fixed).
  "ajv>fast-uri": "^3.1.9"
  "express@4>body-parser": "~1.20.9"
  "inquirer>lodash": "^4.18.1"
  "json-schema-to-typescript>lodash": "^4.18.1"
  "postcss-nested>postcss-selector-parser": "^6.1.5"
  "tailwindcss>postcss-selector-parser": "^6.1.5"
  # T57: qs 6.16.0's advisory (GHSA-6pq8-jhm2-2vcw, published after T55). Every dependant's range
  # admits the fix (Medusa's `^6.15.2`, express 4's and body-parser 1's `~6.16.0`), so the override
  # names the version rather than four edges. Exact, at the first fixed release (2026-10-14): 6.16.2
  # and 6.17.0 were a day old when this was written. Drop it once no dependant resolves 6.16.0.
  "qs@6.16.0": "6.16.1"
  # Audit task (SETUP.md, "Audit after M4"), the T55 pattern again: a fixed release inside the
  # dependant's own range, on that edge only. axios's range is `^1.16.0`; @lexical/headless's is
  # `^20.9.0`, and 20.14.6 closes only the cookie-scope advisory (the other two happy-dom ones are
  # fixed in 21, a major outside it). Drop each once the dependant's own range starts at the fixed
  # release: axios at `^1.16.2`; @lexical/headless at 20.14.6 or at 21 (`^21.0.4` from 0.53.0), when
  # this override would otherwise hold it back at 20.x.
  "axios>follow-redirects": "^1.16.2"
  "@lexical/headless>happy-dom": "^20.14.6"
  # @smithy/core 3.35.1 to 3.38.0 are deprecated on npm (aws/aws-sdk-js-v3#8393: a custom logger could
  # get data unredacted). Not an advisory, so `pnpm audit` does not list it. Every dependant asks
  # `^3.33.2`, `^3.33.3` or `^3.35.0`, so the version moves to 3.38.1, the first release after them
  # (2026-10-30). Drop it once no dependant resolves 3.35.1.
  "@smithy/core@3.35.1": "3.38.1"
