# CI for M0 (plan T16, T17), M1's `design-system` (T24) and M2's gate (T27, D53). Six jobs:
#   check          the root checks, the same ones a contributor runs: no .env, no database.
#   backend-integration
#                  the backend's integration tests (`test:integration:http`) on the compose Postgres.
#   gate           decides which of the next three a pull request needs, from the files it changes
#                  (scripts/ci-gate.ts and its lib, with the rules and their tests). Any other
#                  event runs e2e-smoke and design-system, and windows-smoke unless it is a push.
#   e2e-smoke      the compose stack, `pnpm bootstrap --ci`, a production build, both servers,
#                  the five Playwright suites, `pnpm run doctor` and, last, the storefront's own
#                  routes' console in `next dev` (T25).
#   design-system  the DS cells in English and Greek at 375, 768 and 1440 px: axe, overflow,
#                  44 px controls, the console (T24, D34), then the DS pages' console in `next dev`
#                  (T27). No compose: a build with the flag, `next start` and `next dev` are all it
#                  needs.
#   windows-smoke  install, type check, unit tests, build and a Ctrl-C of `pnpm dev` on NTFS,
#                  weekly and when dependencies change.
# Each job but the gate sets up pnpm and Node with .github/actions/setup, and both storefront jobs
# start the server with .github/actions/start-storefront.
#
# Every command here was run in the same order in the cloud VM before the first push (SETUP.md,
# "CI (T16)"), with the timings given there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # windows-smoke runs weekly (Monday, off the hour on purpose: GitHub delays the busy ones).
  schedule:
    - cron: "43 5 * * 1"
  # Starts every job, windows-smoke included. In the cloud:
  #   gh api -X POST repos/stephanos221/shopblok-starter/actions/workflows/ci.yml/dispatches -f ref=<branch>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# CI has internet access, so the three telemetry opt-outs the cloud environment sets (CLOUD.md) are
# set here too. Medusa's `start` (under `medusa develop`) and `user` (in `pnpm bootstrap --ci`)
# would otherwise queue events and send them.
env:
  MEDUSA_DISABLE_TELEMETRY: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # D53 (M2 plan, T27). A job-level `paths` filter does not exist, so this job decides, and
  # e2e-smoke, design-system and windows-smoke run on its outputs. Both of its rules fail open: a
  # job is skipped only when every changed file is on a list known not to affect it
  # (scripts/lib/ci-gate.ts). The script uses Node's built-ins only, so there is no pnpm and no
  # install: the two jobs behind it wait seconds, not a minute. If it fails, the jobs behind it are
  # skipped and the run is red.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
      design-system: ${{ steps.decide.outputs.design-system }}
      windows: ${{ steps.decide.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Node from .nvmrc: 22.18 and newer run TypeScript files as they are.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node scripts/ci-gate.ts

  check:
    name: check (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Node 24 is informational (Payload v4 readiness): a failure there shows as a red check and
    # does not fail the run.
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 22
            node-version: ""
            informational: false
          - label: Node 24
            node-version: "24"
            informational: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm typecheck
      # `next build` no longer lints (Next 16), so lint is a step of its own.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Not blocking in M0: a new advisory must not fail a PR that touched nothing. Run once, on the
      # required leg. `|| echo ::warning` and not `continue-on-error`, which records a green step.
      - name: Audit production dependencies (not blocking in M0)
        if: ${{ !matrix.informational }}
        run: pnpm audit --prod --audit-level=high || echo "::warning title=pnpm audit::High-severity advisories, or the audit could not run. The step's log has the list."

  # ADR 0002 rests on four behaviours of Medusa 2.21.2 (a search provider that refuses `locales`,
  # `updateTranslationsWorkflow` events, `query.graph`'s `locale`, `search-postgres`'s default
  # configuration) that `search-locale-assumptions.spec.ts` checks. A Medusa bump is the change that
  # breaks them, and Renovate's `@medusajs/*` PRs run this job. The runner makes its own temporary
  # databases on the compose Postgres (`apps/backend/.env.test` names port 15432), so only Postgres
  # is started. It needs no `.env` and no bootstrap.
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: docker compose up -d --wait postgres
      - name: Backend integration tests
        run: pnpm --filter @shopblok/backend test:integration:http
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color postgres | tail -n 60 || true

  e2e-smoke:
    needs: gate
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # `docker compose up --wait`, not `services:`: service containers start before checkout, so
      # the init SQL under infra/ could not be mounted into them.
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Install Playwright's Chromium
        run: pnpm --filter @shopblok/storefront exec playwright install --with-deps chromium
      # Writes both .env files (with the secrets), migrates, seeds, makes the Medusa and Payload
      # admins and the publishable key, fills the `markets` global, and ends with `doctor`.
      - run: pnpm bootstrap --ci
      # After bootstrap: `next build` writes the publishable key into the bundle (SETUP.md, T12
      # item 8) and the `markets` global has to be filled for the prerender.
      - run: pnpm build
      # Both servers are started directly, not through turbo: they get the whole environment and
      # read their own .env. `nohup … &` keeps them up across steps. Medusa first, because the
      # storefront's first answer can read it.
      - name: Start Medusa
        run: |
          mkdir -p "$RUNNER_TEMP/servers"
          nohup pnpm --filter @shopblok/backend dev > "$RUNNER_TEMP/servers/medusa.log" 2>&1 &
          medusa=$!
          for _ in $(seq 120); do
            if curl -fs -o /dev/null http://localhost:9000/health; then
              echo "Medusa answers."
              exit 0
            fi
            # A server that has exited will not answer: fail now, not after the 120 s.
            kill -0 "$medusa" 2>/dev/null || { echo "::error::Medusa exited before it answered; the diagnostics step has its log."; exit 1; }
            sleep 1
          done
          echo "::error::Medusa (:9000/health) did not answer within 120 s."
          exit 1
      # The storefront's PID goes in a file, because the dev-console steps below stop it by PID.
      - name: Start the storefront
        uses: ./.github/actions/start-storefront
        with:
          command: start
          url: http://localhost:8000/
        # Opens the routes under /next/e2e that payload-cache.spec.ts needs (ADR 0001's checks).
        # Only this server gets it; the build above has no say in it.
        env:
          E2E_TEST_ROUTES: "true"
      # markets (T11), wiring (T12), payload-admin, payload-cache (ADR 0001's cache, tag and draft
      # checks) and payload-locales (S3, last: it saves the `markets` global and puts it back) run
      # against the storefront that is up.
      # `--reporter` adds the HTML report that is uploaded below; the config stays as it is.
      - name: Playwright suites
        run: pnpm --filter @shopblok/storefront test:e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      # Every third-party integration is on its fallback, because CI sets none of their keys.
      # (Redis is live, since bootstrap sets REDIS_URL, and Meilisearch is `kind: local`: neither
      # is "third-party".) `ok` is doctor's own verdict, with both servers answering.
      - name: Doctor, as JSON
        run: |
          pnpm --silent run doctor --json > "$RUNNER_TEMP/doctor.json"
          node --eval '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const thirdParty = report.integrations.filter((i) => i.kind === "third-party");
            const notFallback = thirdParty.filter((i) => i.state !== "fallback").map((i) => i.id);
            console.log("third-party integrations:", thirdParty.map((i) => `${i.id}=${i.state}`).join(" "));
            const problems = [];
            if (thirdParty.length !== 5) problems.push(`expected 5 third-party integrations, found ${thirdParty.length}`);
            if (notFallback.length > 0) problems.push(`not on their fallback: ${notFallback.join(", ")}`);
            if (report.ok !== true) problems.push("doctor says ok is false");
            if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          ' "$RUNNER_TEMP/doctor.json"
      - name: Doctor, online (Payload accepts the key, Medusa matches the map, the index has the currencies)
        run: pnpm run doctor --online
      # D37, plan T25 (ADR 0001): the storefront's own routes in `next dev`, judged by the console
      # rules of payload-admin.spec.ts; the DS pages are the design-system job's (T27). Last,
      # because it replaces the storefront: `next start` is stopped by PID (a tree: pnpm, sh, next,
      # next-server), then `next dev` takes port 8000 (it writes to .next/dev, apart from the
      # production build) and the `dev-console` project runs against it. The Payload admin is not
      # visited. The first request compiles `/` (about 20 s on the VM that measured it), hence the
      # 120 s. Its own report and results folders, because a run of Playwright empties the output
      # folder it uses and replaces the HTML report it writes.
      # The project must not run against `next start`, which would pass for the wrong reason, so
      # three things are proved and not assumed: stop-tree.sh exits non-zero if the tree or port 8000
      # is still alive (and the job stops there); `next dev` is alive when it answers; and the
      # answer comes from a dev server (start-storefront checks /_next/static/development/).
      - name: Stop next start
        run: bash .github/scripts/stop-tree.sh --port 8000 "$(cat "$RUNNER_TEMP/servers/storefront.pid")"
      - name: Start next dev
        uses: ./.github/actions/start-storefront
        with:
          command: dev
          url: http://localhost:8000/
          name: storefront-dev
      - name: Console of the storefront in next dev
        run: E2E_DEV_CONSOLE=true pnpm --filter @shopblok/storefront test:e2e --project=dev-console --reporter=list,html --output=test-results-dev-console
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dev-console
      - name: Stop next dev
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront-dev.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      # Postgres, Redis and Meilisearch are the usual cause when Medusa will not start. Their logs
      # go in the folder that is uploaded below, next to the servers'.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/servers"
          docker compose logs --no-color > "$RUNNER_TEMP/servers/compose.log" || true
          docker compose ps --all || true
          tail -n 80 "$RUNNER_TEMP"/servers/*.log || true
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/playwright-report-dev-console
            apps/storefront/test-results
            apps/storefront/test-results-dev-console
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the server logs and doctor's JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/servers
            ${{ runner.temp }}/doctor.json
          if-no-files-found: ignore
          retention-days: 14

  # D34, plan T24: every DS cell (en, el × 375, 768, 1440) against `next start` built with
  # DESIGN_SYSTEM_ENABLED=true; then (T27) the DS pages' console in `next dev`. The DS pages read no
  # data and the build falls back to the market map's build-time default (D10), so there is no
  # compose, no bootstrap and no `.env`: this is the whole of what the job needs, and it runs in
  # parallel with e2e-smoke. Nothing else runs the `design-system` and `dev-console-ds` projects
  # (playwright.config.ts).
  design-system:
    needs: gate
    if: needs.gate.outputs.design-system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm --filter @shopblok/storefront exec playwright install --with-deps chromium
      # Through `next build` itself (the package's `build` script), not turbo: the flag is read at
      # build time and frozen into the static DS pages (D33).
      - name: Build the storefront with the design system on
        run: pnpm --filter @shopblok/storefront build
        env:
          DESIGN_SYSTEM_ENABLED: "true"
      # The suite itself stops with a message if the build lacks the flag.
      - name: Start the storefront
        uses: ./.github/actions/start-storefront
        with:
          command: start
          url: http://localhost:8000/design-system/en
      - name: Design-system checks
        id: ds-checks
        run: pnpm --filter @shopblok/storefront test:e2e --project=design-system --reporter=list,html
        env:
          E2E_DESIGN_SYSTEM: "true"
          PLAYWRIGHT_HTML_OPEN: never
      - name: Stop next start
        id: stop-start
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      # T27 (D53): the DS pages' console in `next dev`, which e2e-smoke checked before and which needs
      # no stack. As e2e-smoke's dev-console steps: stop-tree.sh has freed port 8000, and
      # start-storefront proves the answer comes from a dev server. `next dev` shows the DS without
      # the flag (development). They run when the DS checks ran, failed ones too, as in e2e-smoke
      # apart from those checks; only once `next start` is stopped, never while it may still hold
      # the port; and the check only once `next dev` answers (PR 49 review, item 2).
      - name: Start next dev
        id: start-dev
        if: ${{ !cancelled() && steps.stop-start.outcome == 'success' && (steps.ds-checks.outcome == 'success' || steps.ds-checks.outcome == 'failure') }}
        uses: ./.github/actions/start-storefront
        with:
          command: dev
          url: http://localhost:8000/design-system/en
          name: storefront-dev
      - name: Console of the DS pages in next dev
        if: ${{ !cancelled() && steps.start-dev.outcome == 'success' }}
        run: E2E_DEV_CONSOLE=true pnpm --filter @shopblok/storefront test:e2e --project=dev-console-ds --reporter=list,html --output=test-results-dev-console
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dev-console
      - name: Stop next dev
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront-dev.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      - name: Upload the Playwright report, with the screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: design-system-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/playwright-report-dev-console
            apps/storefront/test-results
            apps/storefront/test-results-dev-console
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: design-system-server-logs
          path: ${{ runner.temp }}/servers
          if-no-files-found: ignore
          retention-days: 14

  # Windows minutes cost double on a private repo, so this runs weekly, on request and on PRs that
  # change a dependency (the gate's rule since T16: a package.json at any depth, the lockfile or
  # pnpm-workspace.yaml).
  windows-smoke:
    needs: gate
    if: needs.gate.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm typecheck
      # The unit tests start processes, stop process trees and open sockets, which Windows does
      # its own way: W2 found two Windows-only failures in them (SETUP.md, "W2 fixes").
      - run: pnpm test
      - run: pnpm build
      # One Ctrl-C typed into the console of `pnpm dev` (the storefront: no database here) must
      # leave no process behind. With npm's `pnpm.cmd` between turbo and each task, turbo waited
      # for ever (W2, finding 1; `scripts/dev.ts`).
      - name: One Ctrl-C stops pnpm dev
        shell: pwsh
        run: ./.github/scripts/dev-ctrl-c.ps1
