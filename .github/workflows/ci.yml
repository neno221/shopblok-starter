# CI for M0 (plan T16, T17), M1's `design-system` (T24), M2's gate (T27, D53) and baselines (T40, D51),
# and M3's `e2e-smoke` (T42, D67).
# Seven jobs:
#   check          the root checks, the same ones a contributor runs: no .env, no database.
#   backend-integration
#                  the backend's integration tests (`test:integration:http`) on the compose Postgres.
#   gate           decides which of the next three a pull request needs, from the files it changes
#                  (scripts/ci-gate.ts and its lib, with the rules and their tests). Any other
#                  event runs e2e-smoke and design-system, and windows-smoke unless it is a push.
#   e2e-smoke      the compose stack, `pnpm bootstrap --ci`, Medusa, a production build (Medusa is
#                  up first, because the catalog pages' `generateStaticParams` read it: ADR 0004,
#                  reading 4), the first-load JS budget (SPEC §13), the storefront, the Playwright
#                  suites, the outage test (ADR 0004; once `e2e/outage.spec.ts` exists), `pnpm run
#                  doctor` and, last, the storefront's own routes' console in `next dev` (T25).
#   design-system  the DS cells in English and Greek at 375, 768 and 1440 px: axe, overflow,
#                  44 px controls, the console (T24, D34), then the DS pages' console in `next dev`
#                  (T27). No compose: a build with the flag, `next start` and `next dev` are all it
#                  needs. T40: it runs in Playwright's container, and each English cell and each of the
#                  40 thumbnails is also compared with its committed baseline (D51, D52).
#   update-baselines
#                  only for a manual run with `update-baselines` on (and then instead of
#                  design-system): the same build and the same two Playwright projects with
#                  `--update-snapshots=changed`, and a commit of the PNGs that changed to the branch.
#                  The only job that can write to the repository.
#   windows-smoke  install, type check, unit tests, build and a Ctrl-C of `pnpm dev` on NTFS,
#                  weekly and when dependencies change.
# Each job but the gate sets up pnpm and Node with .github/actions/setup, and both storefront jobs
# start the server with .github/actions/start-storefront. e2e-smoke starts and stops Medusa with
# .github/actions/start-medusa, the only thing that starts it (T42).
#
# Every command here was run in the same order in the cloud VM before the first push (SETUP.md,
# "CI (T16)"), with the timings given there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # windows-smoke runs weekly (Monday, off the hour on purpose: GitHub delays the busy ones).
  schedule:
    - cron: "43 5 * * 1"
  # Starts every job, windows-smoke included. In the cloud:
  #   gh api -X POST repos/stephanos221/shopblok-starter/actions/workflows/ci.yml/dispatches -f ref=<branch>
  workflow_dispatch:
    inputs:
      update-baselines:
        description: >-
          Write the pixel baselines and the thumbnails that changed and commit them to this branch
          (the update-baselines job, in place of design-system). A push made by this workflow starts
          no workflow: run CI again by hand afterwards.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# CI has internet access, so the three telemetry opt-outs the cloud environment sets (CLOUD.md) are
# set here too. Medusa's `start` (under `medusa develop`) and `user` (in `pnpm bootstrap --ci`)
# would otherwise queue events and send them.
env:
  MEDUSA_DISABLE_TELEMETRY: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # D53 (M2 plan, T27). A job-level `paths` filter does not exist, so this job decides, and
  # e2e-smoke, design-system and windows-smoke run on its outputs. Both of its rules fail open: a
  # job is skipped only when every changed file is on a list known not to affect it
  # (scripts/lib/ci-gate.ts). The script uses Node's built-ins only, so there is no pnpm and no
  # install: the two jobs behind it wait seconds, not a minute. If it fails, the jobs behind it are
  # skipped and the run is red.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
      design-system: ${{ steps.decide.outputs.design-system }}
      windows: ${{ steps.decide.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Node from .nvmrc: 22.18 and newer run TypeScript files as they are.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Empty on every event but a dispatch.
          UPDATE_BASELINES: ${{ inputs.update-baselines }}
        run: node scripts/ci-gate.ts

  check:
    name: check (${{ matrix.label }})
    # A baseline update runs its own job only; the dispatch after it runs this (PR 63 review).
    if: ${{ !inputs.update-baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Node 24 is informational (Payload v4 readiness): a failure there shows as a red check and
    # does not fail the run.
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 22
            node-version: ""
            informational: false
          - label: Node 24
            node-version: "24"
            informational: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      # T57 (M4 D87 item 2): Payload's generated files are what the config makes. `generate:types`
      # writes `payload-types.ts` and formats it with the repo's Prettier preset; `generate:importmap`
      # rewrites the admin's import map. Neither needs a database or a .env. A Payload change
      # committed without them fails here (W5 found the drift on the PC: `next dev` used to rewrite
      # the types, until T57 turned that off).
      - name: Payload's generated files are current
        run: |
          pnpm --filter @shopblok/storefront generate:types
          pnpm --filter @shopblok/storefront generate:importmap
          if [ -n "$(git status --porcelain --untracked-files=all -- apps/storefront/src)" ]; then
            git status --short -- apps/storefront/src
            git diff -- apps/storefront/src
            echo "::error title=Generated files::Payload's generated files differ from the commit. Run \`pnpm --filter @shopblok/storefront generate:types\` and \`generate:importmap\` and commit the result."
            exit 1
          fi
      - run: pnpm typecheck
      # `next build` no longer lints (Next 16), so lint is a step of its own.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Not blocking in M0: a new advisory must not fail a PR that touched nothing. Run once, on the
      # required leg. `|| echo ::warning` and not `continue-on-error`, which records a green step.
      - name: Audit production dependencies (not blocking in M0)
        if: ${{ !matrix.informational }}
        run: pnpm audit --prod --audit-level=high || echo "::warning title=pnpm audit::High-severity advisories, or the audit could not run. The step's log has the list."

  # ADR 0002 rests on four behaviours of Medusa 2.21.2 (a search provider that refuses `locales`,
  # `updateTranslationsWorkflow` events, `query.graph`'s `locale`, `search-postgres`'s default
  # configuration) that `search-locale-assumptions.spec.ts` checks. A Medusa bump is the change that
  # breaks them, and Renovate's `@medusajs/*` PRs run this job. The runner makes its own temporary
  # databases on the compose Postgres (`apps/backend/.env.test` names port 15432), so only Postgres
  # is started. It needs no `.env` and no bootstrap.
  backend-integration:
    if: ${{ !inputs.update-baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # T73 (D89): Medusa loads the markets plugin from its `.medusa/server`, which only a build
      # makes; without it the runner starts the app without the plugin's module and routes.
      - name: Build the markets plugin
        run: pnpm --filter @shopblok/medusa-markets build
      - name: Start Postgres
        run: docker compose up -d --wait postgres
      - name: Backend integration tests
        run: pnpm --filter @shopblok/backend test:integration:http
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color postgres | tail -n 60 || true

  e2e-smoke:
    needs: gate
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # 30 until M3 (about 5 minutes of work at M2's end). D67: the commerce suites (T48 to T54) and
    # the outage test add to it, and 45 leaves room for them.
    timeout-minutes: 45
    # D58, D67 item 2: the build prerenders four of the demo catalog's eight products, and the outage
    # spec takes its subjects from past the same cap, so both read it from here. T50: three products
    # a listing page, for the build and for `next start` alike (the first pages are built, the
    # others and the island's answers are not), so apparel's four demo products have a `/page/2`.
    env:
      STOREFRONT_PRERENDER_PRODUCTS: "4"
      STOREFRONT_LISTING_PAGE_SIZE: "3"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # `docker compose up --wait`, not `services:`: service containers start before checkout, so
      # the init SQL under infra/ could not be mounted into them.
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Install Playwright's Chromium
        run: pnpm --filter @shopblok/storefront exec playwright install --with-deps chromium
      # `pnpm bootstrap` builds the markets plugin too (its step 3, T73), before its migration and
      # before any Medusa start, so this job needs no build step of its own.
      # Writes both .env files (with the secrets), migrates, seeds, makes the Medusa and Payload
      # admins and the publishable key, fills the `markets` global, and ends with `doctor`.
      - run: pnpm bootstrap --ci
      # T57 (M4 D87 item 2, D88): every schema change has its saved migration. After bootstrap has
      # applied the committed migrations, `migrate:create --skip-empty` writes a file only when the
      # config differs from the last migration's snapshot. Its log line "generating UP statements"
      # shows it ran: Payload's CLI exits 0 now and then without doing anything (SETUP.md, CLOUD.md
      # step 4), which here would pass. Such a silent run is repeated, up to three attempts in all, as
      # `retryWhileSilent` does for bootstrap and doctor (PR 89 review, item 1); a run with no change
      # writes nothing, so repeating it is safe.
      - name: Payload's migrations match the config
        run: |
          for attempt in 1 2 3; do
            out="$(pnpm --filter @shopblok/storefront payload migrate:create --skip-empty ci-check 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            grep -q "generating UP statements" <<<"$out" && break
            if [ "$attempt" = 3 ]; then
              echo "::error title=Migration check::migrate:create printed no sign that it ran, three times."
              exit 1
            fi
            echo "::warning title=Migration check::migrate:create exited without running (attempt $attempt); repeating it."
          done
          if [ -n "$(git status --porcelain --untracked-files=all -- apps/storefront/src/migrations)" ]; then
            git status --short -- apps/storefront/src/migrations
            git diff -- apps/storefront/src/migrations/index.ts
            git ls-files --others --exclude-standard -- 'apps/storefront/src/migrations/*.ts' | xargs -r cat
            echo "::error title=Missing migration::The Payload config changes the schema without a saved migration. Create it with \`pnpm --filter @shopblok/storefront payload migrate:create <name>\` on a branch rebased on main (M4 D88) and commit it."
            exit 1
          fi
      # Medusa before the build (T42, D67 item 1; ADR 0004, reading 4): the catalog pages'
      # `generateStaticParams` read the backend while `next build` runs, and with MEDUSA_BACKEND_URL set
      # an unreachable Medusa fails the build. The action is the only thing that starts Medusa: its PID
      # file, `$RUNNER_TEMP/servers/medusa.pid`, names the process the outage test stops and the step
      # after it starts again.
      - name: Start Medusa
        uses: ./.github/actions/start-medusa
      # After bootstrap: `next build` writes the publishable key into the bundle (SETUP.md, T12
      # item 8) and the `markets` global has to be filled for the prerender.
      # STOREFRONT_PRERENDER_PRODUCTS (the job's env, D58, D67 item 2): four of the demo catalog's
      # eight products are prerendered, so the outage test has pages that render on request
      # (apps/storefront/turbo.json lists it for the build).
      # Only the storefront is built (PR 69 review, item 5): `--filter` selects the entry point and
      # turbo still runs its `^build` and `transit` dependencies (the packages it imports; none has a
      # build script of its own, so there is nothing to run for them). The backend's `medusa build`
      # is left out: nothing in this job reads `apps/backend/.medusa/server` (Medusa runs from source
      # as `medusa develop`; doctor, the suites and next dev talk to it over HTTP), and it would
      # rewrite `.medusa/` and run a Vite admin build beside the server on two cores. The `check`
      # job builds the whole workspace, so `medusa build` stays covered there (it is the backend's
      # type check).
      - name: Build the storefront
        run: pnpm exec turbo run build --filter=@shopblok/storefront
      # T42, D67 item 4 (SPEC §13): the PLP's and the PDP's first-load JS, gzipped, from the file Next
      # writes after a Turbopack build. The table of every route is in the log.
      - name: First-load JS budget
        run: pnpm --filter @shopblok/storefront check:first-load
      # Both servers are started directly, not through turbo: they get the whole environment and
      # read their own .env. `nohup … &` keeps them up across steps.
      # The storefront's PID goes in a file, because the dev-console steps below stop it by PID.
      - name: Start the storefront
        uses: ./.github/actions/start-storefront
        with:
          command: start
          url: http://localhost:8000/
        # Opens the routes under /next/e2e that payload-cache.spec.ts needs (ADR 0001's checks).
        # Only this server gets it; the build above has no say in it.
        env:
          E2E_TEST_ROUTES: "true"
      # markets (T11), wiring (T12; the home since T51), payload-admin, payload-cache (ADR 0001's
      # cache, tag and draft checks), editor-homepage (T71: an editor builds the home in the admin)
      # and payload-locales (S3: it saves the `markets` global and puts it back) run against the
      # storefront that is up. markets-add (T71) is last, in a project of its own: it adds Austria
      # in Medusa and in Payload's Markets page, waits for /at, and takes both away again.
      # `--reporter` adds the HTML report that is uploaded below; the config stays as it is.
      # auth.spec.ts (T53) reads the links Medusa's local notification provider prints in the log
      # the start-medusa action writes (the first start's: the outage steps come after).
      - name: Playwright suites
        run: pnpm --filter @shopblok/storefront test:e2e --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          E2E_MEDUSA_LOG: ${{ runner.temp }}/servers/medusa.log
      # T42, D67 item 2 (the specs are T49's): ADR 0004's outage test. Skipped while
      # `e2e/outage.spec.ts` does not exist. The spec stops Medusa through
      # `.github/scripts/stop-tree.sh --port 9000` on the PID file (`E2E_MEDUSA_PID`,
      # e2e/support/medusa-process.ts), expects O2's 200, O3's 5xx, O4's 404 and `/next/status`'s 503, and
      # leaves Medusa down. The action starts it again (the one process that owns :9000), and the
      # second spec, O5, finds every page recovered with no restart of the storefront. Each run has
      # its own report and results folders, because a run of Playwright empties the output folder it
      # uses; a file the first spec writes in `test-results-outage/` survives the second run.
      - name: Outage test (Medusa stopped)
        if: ${{ hashFiles('apps/storefront/e2e/outage.spec.ts') != '' }}
        run: pnpm --filter @shopblok/storefront test:e2e --project=outage --reporter=list,html --output=test-results-outage e2e/outage.spec.ts
        env:
          E2E_OUTAGE: "true"
          E2E_MEDUSA_PID: ${{ runner.temp }}/servers/medusa.pid
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-outage
      - name: Start Medusa again
        if: ${{ hashFiles('apps/storefront/e2e/outage.spec.ts') != '' }}
        uses: ./.github/actions/start-medusa
        with:
          log: medusa-restart.log
      # Gated on its own spec: if T49 lands outage.spec.ts first, this step must not fail e2e-smoke with
      # "No tests found" (PR 69 review, item 1). The restart above stays on outage.spec.ts, since that
      # spec leaves Medusa down either way.
      - name: Outage recovery test (Medusa started again)
        if: ${{ hashFiles('apps/storefront/e2e/outage-recovery.spec.ts') != '' }}
        run: pnpm --filter @shopblok/storefront test:e2e --project=outage --reporter=list,html --output=test-results-outage-recovery e2e/outage-recovery.spec.ts
        env:
          E2E_OUTAGE: "true"
          E2E_MEDUSA_PID: ${{ runner.temp }}/servers/medusa.pid
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-outage-recovery
      # Every third-party integration is on its fallback, because CI sets none of their keys.
      # (Redis is live, since bootstrap sets REDIS_URL, and Meilisearch is `kind: local`: neither
      # is "third-party".) `ok` is doctor's own verdict, with both servers answering.
      - name: Doctor, as JSON
        run: |
          pnpm --silent run doctor --json > "$RUNNER_TEMP/doctor.json"
          node --eval '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const thirdParty = report.integrations.filter((i) => i.kind === "third-party");
            const notFallback = thirdParty.filter((i) => i.state !== "fallback").map((i) => i.id);
            console.log("third-party integrations:", thirdParty.map((i) => `${i.id}=${i.state}`).join(" "));
            const problems = [];
            if (thirdParty.length !== 5) problems.push(`expected 5 third-party integrations, found ${thirdParty.length}`);
            if (notFallback.length > 0) problems.push(`not on their fallback: ${notFallback.join(", ")}`);
            if (report.ok !== true) problems.push("doctor says ok is false");
            if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          ' "$RUNNER_TEMP/doctor.json"
      - name: Doctor, online (Payload accepts the key, Medusa matches the map, the index has the currencies)
        run: pnpm run doctor --online
      # D37, plan T25 (ADR 0001): the storefront's own routes in `next dev`, judged by the console
      # rules of payload-admin.spec.ts; the DS pages are the design-system job's (T27). Last,
      # because it replaces the storefront: `next start` is stopped by PID (a tree: pnpm, sh, next,
      # next-server), then `next dev` takes port 8000 (it writes to .next/dev, apart from the
      # production build) and the `dev-console` project runs against it. The Payload admin is not
      # visited. The first request compiles `/` (about 20 s on the VM that measured it), hence the
      # 120 s. Its own report and results folders, because a run of Playwright empties the output
      # folder it uses and replaces the HTML report it writes.
      # The project must not run against `next start`, which would pass for the wrong reason, so
      # three things are proved and not assumed: stop-tree.sh exits non-zero if the tree or port 8000
      # is still alive (and the job stops there); `next dev` is alive when it answers; and the
      # answer comes from a dev server (start-storefront checks /_next/static/development/).
      - name: Stop next start
        run: bash .github/scripts/stop-tree.sh --port 8000 "$(cat "$RUNNER_TEMP/servers/storefront.pid")"
      - name: Start next dev
        uses: ./.github/actions/start-storefront
        with:
          command: dev
          url: http://localhost:8000/
          name: storefront-dev
      - name: Console of the storefront in next dev
        id: dev-console
        run: E2E_DEV_CONSOLE=true pnpm --filter @shopblok/storefront test:e2e --project=dev-console --reporter=list,html --output=test-results-dev-console
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dev-console
      # T28 (D54): `[market]` answered root files such as `/robots.txt` and logged `Could not
      # validate` to the server log for each, where the browser's console never sees it. The routes
      # above include two of them; the log is complete once their run has ended, passed or failed.
      # W5: Next's dev-only instant-navigation check ("Next.js encountered URL data …") also goes to
      # this log a few seconds after the page answers, so the step waits 10 s before it reads the log
      # (PR 85 review, item 2: an absence cannot be polled for).
      - name: No validation error in next dev's log
        if: ${{ !cancelled() && (steps.dev-console.outcome == 'success' || steps.dev-console.outcome == 'failure') }}
        run: |
          sleep 10
          if grep -n -E "Could not validate|Next\.js encountered" "$RUNNER_TEMP/servers/storefront-dev.log"; then
            echo "::error::next dev logged a validation error (above); storefront-dev.log in the server logs artifact has the rest."
            exit 1
          fi
          echo "next dev logged no validation error."
      - name: Stop next dev
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront-dev.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      # By the PID file of the last start (T42). A job that never started Medusa has no file and
      # nothing to stop; a file with no number in it fails, because a failed start must not pass for
      # "nothing to stop".
      - name: Stop Medusa
        if: always()
        uses: ./.github/actions/start-medusa
        with:
          stop: "true"
      # Postgres, Redis and Meilisearch are the usual cause when Medusa will not start. Their logs
      # go in the folder that is uploaded below, next to the servers'.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/servers"
          docker compose logs --no-color > "$RUNNER_TEMP/servers/compose.log" || true
          docker compose ps --all || true
          tail -n 80 "$RUNNER_TEMP"/servers/*.log || true
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/playwright-report-dev-console
            apps/storefront/playwright-report-outage
            apps/storefront/playwright-report-outage-recovery
            apps/storefront/test-results
            apps/storefront/test-results-dev-console
            apps/storefront/test-results-outage
            apps/storefront/test-results-outage-recovery
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the server logs and doctor's JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/servers
            ${{ runner.temp }}/doctor.json
          if-no-files-found: ignore
          retention-days: 14

  # D34, plan T24: every DS cell (en, el × 375, 768, 1440) against `next start` built with
  # DESIGN_SYSTEM_ENABLED=true; then (T27) the DS pages' console in `next dev`. The DS pages read no
  # data and the build falls back to the market map's build-time default (D10), so there is no
  # compose, no bootstrap and no `.env`: this is the whole of what the job needs, and it runs in
  # parallel with e2e-smoke. Nothing else runs the `design-system` and `dev-console-ds` projects
  # (playwright.config.ts).
  design-system:
    needs: gate
    # A manual run with `update-baselines` makes the baselines in the next job and does not compare
    # them; the run after it does.
    if: ${{ needs.gate.outputs.design-system == 'true' && !inputs.update-baselines }}
    runs-on: ubuntu-latest
    # T40 (D51): Playwright's image, so the browser and the fonts are the ones the baselines were
    # made with; `--ipc=host` because Chromium shares memory through /dev/shm (Playwright's Docker
    # page). Bump the tag with `@playwright/test` (Renovate groups them).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    # next-intl's plugin loads @swc/core with next.config.ts (T46). SWC's native addon unpacks itself
    # into a cache that it refuses when a parent is writable by others without the sticky bit, which
    # the container's HOME (/github/home) is: the build failed with ERR_SWC_NATIVE_CACHE (PR 70).
    # /tmp is sticky, so a root there passes.
    env:
      SWC_NATIVE_BINDING_CACHE: /tmp/swc-native-cache
    # Two Playwright projects: the DS checks (~17 min on the runner at T37) and the next dev console
    # check (~10-40 s a page while it compiles). 30 min was reached at T37 (PR 59); room for M2's pages.
    timeout-minutes: 50
    steps:
      # Before checkout, which downloads a tarball instead of cloning when git is missing.
      - name: Tools the steps use (T40)
        shell: bash
        run: |
          missing=()
          command -v git >/dev/null 2>&1 || missing+=(git)
          command -v ps >/dev/null 2>&1 || missing+=(procps)
          command -v awk >/dev/null 2>&1 || missing+=(gawk)
          command -v curl >/dev/null 2>&1 || missing+=(curl)
          # stop-tree.sh's port check wants one of the three.
          if ! command -v lsof >/dev/null 2>&1 && ! command -v ss >/dev/null 2>&1 && ! command -v fuser >/dev/null 2>&1; then missing+=(lsof); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The image lacks: ${missing[*]}. Installing."
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          else
            echo "The image has git, ps, awk, curl and one of lsof, ss or fuser."
          fi
          git --version
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # No `playwright install`: the image has the browser that @playwright/test 1.64.0 drives.
      # Through `next build` itself (the package's `build` script), not turbo: the flag is read at
      # build time and frozen into the static DS pages (D33).
      - name: Build the storefront with the design system on
        run: pnpm --filter @shopblok/storefront build
        env:
          DESIGN_SYSTEM_ENABLED: "true"
      # The suite itself stops with a message if the build lacks the flag.
      - name: Start the storefront
        uses: ./.github/actions/start-storefront
        with:
          command: start
          url: http://localhost:8000/design-system/en
      # The cells (their pixels too, D51) and the 40 thumbnails (D52). A baseline that is missing
      # fails its cell: only the update-baselines job writes them.
      - name: Design-system checks
        id: ds-checks
        run: pnpm --filter @shopblok/storefront test:e2e --project=design-system --project=thumbnails --reporter=list,html
        env:
          E2E_DESIGN_SYSTEM: "true"
          PLAYWRIGHT_HTML_OPEN: never
      - name: Stop next start
        id: stop-start
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      # T27 (D53): the DS pages' console in `next dev`, which e2e-smoke checked before and which needs
      # no stack. As e2e-smoke's dev-console steps: stop-tree.sh has freed port 8000, and
      # start-storefront proves the answer comes from a dev server. `next dev` shows the DS without
      # the flag (development). They run when the DS checks ran, failed ones too, as in e2e-smoke
      # apart from those checks; only once `next start` is stopped, never while it may still hold
      # the port; and the check only once `next dev` answers (PR 49 review, item 2).
      - name: Start next dev
        id: start-dev
        if: ${{ !cancelled() && steps.stop-start.outcome == 'success' && (steps.ds-checks.outcome == 'success' || steps.ds-checks.outcome == 'failure') }}
        uses: ./.github/actions/start-storefront
        with:
          command: dev
          url: http://localhost:8000/design-system/en
          name: storefront-dev
      - name: Console of the DS pages in next dev
        if: ${{ !cancelled() && steps.start-dev.outcome == 'success' }}
        run: E2E_DEV_CONSOLE=true pnpm --filter @shopblok/storefront test:e2e --project=dev-console-ds --reporter=list,html --output=test-results-dev-console
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dev-console
      - name: Stop next dev
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront-dev.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      # A cell that differs has its expected, actual and diff images in the report and in
      # test-results.
      - name: Upload the Playwright report, with the screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: design-system-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/playwright-report-dev-console
            apps/storefront/test-results
            apps/storefront/test-results-dev-console
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: design-system-server-logs
          path: ${{ runner.temp }}/servers
          if-no-files-found: ignore
          retention-days: 14

  # T40 (D51, D52): `workflow_dispatch` with `update-baselines` on. The same container, build and
  # server as design-system, then both Playwright projects with `--update-snapshots=changed` (a
  # snapshot that is missing or differs is written; one that matches is left alone), over every
  # cell: the whole suite runs, so a failing axe or console check stops the job before anything is
  # committed. The commit holds the PNGs under apps/storefront/e2e/__screenshots__/ and
  # apps/storefront/public/registry/ and nothing else. This is the only job with `contents: write`.
  # A push made with GITHUB_TOKEN starts no workflow, so the session runs CI again by hand.
  update-baselines:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baselines }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    # As in design-system: SWC's native cache under /tmp, not the container's HOME.
    env:
      SWC_NATIVE_BINDING_CACHE: /tmp/swc-native-cache
    timeout-minutes: 50
    steps:
      # Before checkout, which downloads a tarball instead of cloning when git is missing.
      - name: Tools the steps use (T40)
        shell: bash
        run: |
          missing=()
          command -v git >/dev/null 2>&1 || missing+=(git)
          command -v ps >/dev/null 2>&1 || missing+=(procps)
          command -v awk >/dev/null 2>&1 || missing+=(gawk)
          command -v curl >/dev/null 2>&1 || missing+=(curl)
          # stop-tree.sh's port check wants one of the three.
          if ! command -v lsof >/dev/null 2>&1 && ! command -v ss >/dev/null 2>&1 && ! command -v fuser >/dev/null 2>&1; then missing+=(lsof); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The image lacks: ${missing[*]}. Installing."
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          else
            echo "The image has git, ps, awk, curl and one of lsof, ss or fuser."
          fi
          git --version
      # The branch the dispatch names, which the commit goes to. The write token is not kept in
      # .git/config: install, build and the suite run third-party code, and only the commit step
      # gets it (PR 63 review).
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # A clean set: every baseline is written again, so a PNG no cell makes any more (a renamed
      # entry, a dropped locale) shows as deleted, and an unchanged one is byte for byte the same
      # file, which git does not count (PR 63 review).
      - name: Remove the current baselines and thumbnails
        shell: bash
        run: rm -rf apps/storefront/e2e/__screenshots__/design-system apps/storefront/public/registry
      # T57 (M4 D72): the lossless PNG optimiser the commit step runs on the PNGs it is about to
      # commit. A release binary pinned by version and checksum: Ubuntu 24.04, the image's base, has
      # no package for it. A new version may write other bytes for the same pixels, which would show
      # every compressed PNG as changed, so bump it only with a baseline update in mind.
      - name: oxipng (T57)
        shell: bash
        env:
          OXIPNG_VERSION: "10.2.1"
          OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
        run: |
          set -euo pipefail
          name="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/oxipng.tar.gz" "https://github.com/shssoichiro/oxipng/releases/download/v${OXIPNG_VERSION}/${name}.tar.gz"
          echo "${OXIPNG_SHA256}  $RUNNER_TEMP/oxipng.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oxipng.tar.gz" -C "$RUNNER_TEMP" "${name}/oxipng"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/${name}/oxipng" --version
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Build the storefront with the design system on
        run: pnpm --filter @shopblok/storefront build
        env:
          DESIGN_SYSTEM_ENABLED: "true"
      - name: Start the storefront
        uses: ./.github/actions/start-storefront
        with:
          command: start
          url: http://localhost:8000/design-system/en
      - name: Design-system checks and thumbnails, writing the baselines that changed
        id: update
        run: pnpm --filter @shopblok/storefront test:e2e --project=design-system --project=thumbnails --update-snapshots=changed --reporter=list,html
        env:
          E2E_DESIGN_SYSTEM: "true"
          PLAYWRIGHT_HTML_OPEN: never
      - name: Stop next start
        if: always()
        run: |
          pid="$(cat "$RUNNER_TEMP/servers/storefront.pid" 2>/dev/null || true)"
          if [ -n "$pid" ]; then bash .github/scripts/stop-tree.sh --port 8000 "$pid"; fi
      # Only when every check passed. D51's numbers are printed here and in the run's summary: the
      # PNGs that changed, the bytes the commit adds, the size of the whole set. A session stops and
      # asks when an update adds more than half a set, when the set passes 60 MB or the history
      # 200 MB (SETUP.md, "Baselines and thumbnails (T40)").
      - name: Commit the baselines that changed
        if: ${{ steps.update.outcome == 'success' }}
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The container runs as root over a workspace the runner's user owns.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$REF_TYPE" != branch ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::update-baselines commits to a feature branch; this run is on '$BRANCH' ($REF_TYPE). Dispatch it on the branch of the change."
            exit 1
          fi
          dirs=(apps/storefront/e2e/__screenshots__ apps/storefront/public/registry)
          # T57 (M4 D72): compress what differs from the branch's commit before adding it: the PNGs
          # Playwright wrote new, and those whose bytes changed. Lossless, so `toHaveScreenshot`, which
          # compares decoded pixels, accepts them as they were. A PNG whose pixels did not change is
          # either Playwright's own bytes, as committed (nothing to do), or, if the commit holds a
          # compressed copy, Playwright's bytes again, which oxipng turns back into exactly that copy.
          # The rest of the set stays as it is: it shrinks as cells change (no one-time rewrite).
          mapfile -t written < <(git status --porcelain --untracked-files=all -- "${dirs[@]}" \
            | awk 'substr($0, 1, 2) != " D" && $NF ~ /\.png$/ { print $NF }')
          if [ "${#written[@]}" -gt 0 ]; then
            size() { stat -c %s "$@" | awk '{ s += $1 } END { print s + 0 }'; }
            before=$(size "${written[@]}")
            oxipng -o 2 --strip safe --quiet -- "${written[@]}"
            after=$(size "${written[@]}")
            echo "oxipng: ${#written[@]} PNGs written by this run, $before bytes before, $after after."
            { echo "### oxipng"; echo "${#written[@]} PNGs written by this run: $before bytes before, $after after."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Only these two folders are added, and only PNGs are expected in them.
          git add -A -- "${dirs[@]}"
          stray="$(git diff --cached --name-only | grep -Ev '\.png$' || true)"
          if [ -n "$stray" ]; then
            echo "::error::A file other than a PNG is staged: $stray"
            exit 1
          fi
          total=$(git ls-files -- "${dirs[@]}" | grep -c '\.png$' || true)
          added=$(git diff --cached --name-only --diff-filter=A | wc -l)
          modified=$(git diff --cached --name-only --diff-filter=M | wc -l)
          deleted=$(git diff --cached --name-only --diff-filter=D | wc -l)
          changed=$((added + modified + deleted))
          bytes=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            bytes=$((bytes + $(git cat-file -s ":$file")))
          done < <(git diff --cached --name-only --diff-filter=AM)
          set_bytes=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            set_bytes=$((set_bytes + $(git cat-file -s ":$file")))
          done < <(git ls-files -- "${dirs[@]}")
          mb() { awk -v b="$1" 'BEGIN { printf "%.2f MB", b / 1048576 }'; }
          report="PNGs changed: $changed ($added new, $modified changed, $deleted deleted) of $total in the set. Bytes added by this commit: $bytes ($(mb "$bytes")). The set: $(mb "$set_bytes")."
          echo "$report"
          { echo "### Baselines"; echo "$report"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" -eq 0 ]; then
            echo "Nothing changed: no commit."
            echo "Nothing changed, so there is nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # D51's stop lines. The history's 200 MB is measured in a clone (`git count-objects -vH`).
          if [ "$set_bytes" -gt 62914560 ]; then
            echo "::warning title=Baselines over 60 MB::The set is $(mb "$set_bytes"). D51: stop and ask (the fallback is baselines in en only)."
          fi
          if [ $((changed * 2)) -gt "$total" ]; then
            echo "::warning title=More than half a set::This update changes $changed of $total PNGs. D51: stop and ask."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pixel baselines and thumbnails (run ${GITHUB_RUN_ID})" -m "$report"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"
          sha="$(git rev-parse --short HEAD)"
          next="CI must be run again by hand: a push made with GITHUB_TOKEN starts no workflow. Commit $sha is on $BRANCH. Dispatch: gh api -X POST repos/$REPO/actions/workflows/ci.yml/dispatches -f ref=$BRANCH"
          echo "$next"
          echo "$next" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: update-baselines-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: update-baselines-server-logs
          path: ${{ runner.temp }}/servers
          if-no-files-found: ignore
          retention-days: 14

  # Windows minutes cost double on a private repo, so this runs weekly, on request and on PRs that
  # change a dependency (the gate's rule since T16: a package.json at any depth, the lockfile or
  # pnpm-workspace.yaml).
  windows-smoke:
    needs: gate
    if: needs.gate.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm typecheck
      # The unit tests start processes, stop process trees and open sockets, which Windows does
      # its own way: W2 found two Windows-only failures in them (SETUP.md, "W2 fixes").
      - run: pnpm test
      - run: pnpm build
      # One Ctrl-C typed into the console of `pnpm dev` (the storefront: no database here) must
      # leave no process behind. With npm's `pnpm.cmd` between turbo and each task, turbo waited
      # for ever (W2, finding 1; `scripts/dev.ts`).
      - name: One Ctrl-C stops pnpm dev
        shell: pwsh
        run: ./.github/scripts/dev-ctrl-c.ps1
